<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Cos'è Clepsi 4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 96px 88px 80px; background: #121214; color: #F6F5F1; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 30px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #D4FF3A">La mattina dopo</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 84px; line-height: 0.98; letter-spacing: -0.035em">Il titolare sa quali commesse guadagnano.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{commesse}}" as="c" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 22px; padding: 22px 26px; border-radius: 26px; background: #1C1C21; border: 1px solid #2E2E34">
<span style="flex: 0 0 auto; width: 12px; height: 64px; border-radius: 6px; background: {{c.col}}"></span>
<span style="flex: 1 1 auto; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 40px">{{c.nome}}</span>
<span style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; font-size: 30px; font-weight: 700; color: {{c.scol}}"><sc-if value="{{c.ok}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if><sc-if value="{{c.warn}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v6"></path><path d="M12 17v.5"></path></svg></sc-if><sc-if value="{{c.loss}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></sc-if><sc-if value="{{c.nuova}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2"></path></svg></sc-if>{{c.stato}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 40px">
<span style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; color: #D4FF3A">Apre presto.</span><span style="font-size: 30px; color: #D8D7DE">I primi 100 studi entrano a metà prezzo, per sempre. Link in bio.</span></span>
<span style="font-size: 28px; color: #A9A8B2; white-space: nowrap">4 / 4</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const c = (nome, col, stato, k, scol) => ({ nome, col, stato, scol, ok: k === 'ok', warn: k === 'warn', loss: k === 'loss', nuova: k === 'new' });
    return { commesse: [
      c('Villa Rossi', '#D4FF3A', 'In attivo', 'ok', '#D4FF3A'),
      c('Scuola Brera', '#9B8CFF', 'Margine stretto', 'warn', '#FFC46B'),
      c('Uffici Lambrate', '#6FD3FF', 'In perdita', 'loss', '#FF8A7A'),
      c('Loft Navigli', '#FF9ECF', 'Appena iniziata', 'new', '#C9C8D0')
    ] };
  }
}
</script>
</body>
</html>
